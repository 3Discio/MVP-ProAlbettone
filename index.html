<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MVP della Partita</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="MVP">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:16px/1.4 system-ui,sans-serif;padding-bottom:80px}
h1,h2,h3,.big,button{font-family:Oswald,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em}
h1{margin:0;font-size:26px;color:var(--acc)}h2{font-size:22px;margin:18px 0 8px}h3{font-size:17px;margin:14px 0 6px;color:var(--acc)}
.w{max-width:600px;margin:0 auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:env(safe-area-inset-top,0)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
input,select{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--in);color:#fff;font-size:16px;margin:4px 0}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--ink);font-size:16px;cursor:pointer;width:100%;margin-top:6px}
button.g{background:transparent;color:#fff;border:2px solid var(--line)}button.r{background:#b3261e;color:#fff}
button.s{width:auto;padding:6px 10px;font-size:13px;margin:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>.f{flex:1}
.mut{color:var(--mut);font-size:14px}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}.tag.o{background:var(--acc);color:var(--ink)}
.p{display:flex;gap:10px;align-items:center;background:var(--in);border:2px solid var(--line);border-radius:12px;padding:10px;margin:6px 0;width:100%;text-align:left;color:#fff;text-transform:none;letter-spacing:0;font-family:inherit}
.p.on{border-color:var(--acc);background:#3a4a10}.rk{background:var(--acc);color:var(--ink);border-radius:8px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Oswald,Impact,sans-serif}
.mvp{text-align:center;background:linear-gradient(160deg,#ffd60a,#f59e0b);color:var(--ink);border-radius:18px;padding:20px 10px;margin:12px 0}.mvp .big{font-size:56px;line-height:1}.mvp b{font-family:Oswald,Impact,sans-serif;font-size:28px;text-transform:uppercase}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#072a19;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;padding:14px 2px;font-size:14px;letter-spacing:.02em}nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.err{background:#5a1a16;border-radius:10px;padding:10px;margin:8px 0}
/* ===== TEMA SQUADRA: cambia solo --team per ricolorare tutto il sito ===== */
:root{--team:#d7142c;
--bg:color-mix(in srgb,var(--team) 18%,#000);--card:color-mix(in srgb,var(--team) 30%,#000);
--line:color-mix(in srgb,var(--team) 65%,#000);--in:color-mix(in srgb,var(--team) 10%,#000);
--acc:var(--team);--ink:#fff;--mut:color-mix(in srgb,var(--team) 30%,#fff);--hl:color-mix(in srgb,var(--team) 20%,#fff)}
h1,h3,nav button.on{color:var(--hl)}
nav{background:color-mix(in srgb,var(--team) 12%,#000)}
.p.on{background:color-mix(in srgb,var(--team) 45%,#000);border-color:#fff}
.mvp{background:linear-gradient(160deg,var(--team),color-mix(in srgb,var(--team) 55%,#000));color:#fff;border:2px solid #fff}
button.r{background:#fff;color:color-mix(in srgb,var(--team) 60%,#000)}
.err{background:#000;border:2px solid var(--team)}
.lg{height:80px;max-width:100%;object-fit:contain;vertical-align:middle;margin-right:6px}
.top .lg{height:100px;max-width:60vw}
ol{padding-left:22px;margin:6px 0}li{margin:5px 0}
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--team) 70%,#000),color-mix(in srgb,var(--team) 22%,#000) 70%)}
#ov .x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:auto;margin:0;padding:6px 10px;background:transparent;color:var(--mut);font-size:18px}
.sc{width:100%;max-width:400px;text-align:center;margin:auto 0}.sc .lg{height:64px;margin:0}
.sc .t{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--hl);font-size:14px;margin-top:6px}
.sc .vs{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;font-size:30px;line-height:1.1;margin:12px 0 2px}
.sc .mvpbox{background:#fff;color:color-mix(in srgb,var(--team) 60%,#000);border-radius:20px;padding:22px 12px;margin:20px 0 12px}
.sc .mvpbox .l{font-family:Oswald,Impact,sans-serif;letter-spacing:.2em;font-size:18px;color:var(--team)}
.sc .mvpbox .n{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;font-size:clamp(30px,10vw,44px);line-height:1.05;margin:6px 0}
/* card MVP quadrata (Instagram 1:1) */
#ov.sqov{background:#120204;align-items:center;flex-direction:column;gap:14px}
.sqw{position:relative;width:min(88vw,calc(100vh - 150px),560px);width:min(88vw,calc(100dvh - 150px),560px);aspect-ratio:1/1;flex:none}
.sq{position:absolute;inset:0;container-type:inline-size;--f:1;overflow:hidden;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--team) 85%,#000),color-mix(in srgb,var(--team) 30%,#000) 75%);color:#fff;text-align:center}
.sqi{position:absolute;inset:0;padding:6cqw 6cqw 5cqw;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--f) * 2.6cqw)}
.sqd{font-family:Oswald,Impact,sans-serif;font-size:calc(var(--f) * 4.4cqw);letter-spacing:.03em}.sqd:first-letter{text-transform:uppercase}
.sqh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2.5cqw}
.sql{justify-self:stretch;display:flex;justify-content:center}.sql img{height:calc(var(--f) * 24cqw);width:100%;object-fit:contain;display:block;transform:scale(1.18);transform-origin:right center}
.sqs{min-width:11cqw;height:11cqw;padding:0 3cqw;border-radius:99px;background:#fff;color:var(--team);display:flex;align-items:center;justify-content:center;font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:calc(var(--f) * 5cqw);white-space:nowrap;box-shadow:0 0 0 1cqw rgba(255,255,255,.25)}
.sqo{justify-self:center;font-family:Oswald,Impact,sans-serif;text-transform:uppercase;font-size:calc(var(--f) * 4.3cqw);line-height:1.1;opacity:.92}
.sqb{background:#fff;color:color-mix(in srgb,var(--team) 60%,#000);border-radius:4cqw;padding:calc(var(--f) * 3.4cqw) 3cqw}
.sqk{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.22em;font-size:calc(var(--f) * 3.8cqw);color:var(--team)}
.sqn{font-family:Oswald,Impact,sans-serif;font-weight:700;line-height:1.1;white-space:nowrap;margin:1cqw 0}
.sqp{font-size:calc(var(--f) * 3.6cqw);font-weight:600}
.sqr{display:flex;justify-content:space-between;align-items:center;gap:3cqw;padding:calc(var(--f) * 1.6cqw) 3.4cqw;border:1px solid rgba(255,255,255,.3);border-radius:3cqw;color:var(--mut);font-size:calc(var(--f) * 3.4cqw)}
.sqr .rl{display:flex;align-items:center;gap:3cqw;text-align:left}.sqr i{font-style:normal;font-family:Oswald,Impact,sans-serif;font-size:calc(var(--f) * 4cqw)}
.sqr .nm b{display:block;font-family:Oswald,Impact,sans-serif;font-size:calc(var(--f) * 4.4cqw);color:#fff;letter-spacing:.02em;line-height:1.1}.sqr .nm small{display:block;font-size:calc(var(--f) * 3cqw)}
.cm{position:absolute;width:0;height:0;pointer-events:none}.cm::before,.cm::after{content:'';position:absolute;background:#fff}
.cm::before{width:20px;height:2px;top:-1px}.cm::after{width:2px;height:20px;left:-1px}
.cm.tl{top:0;left:0}.cm.tl::before{left:-26px}.cm.tl::after{top:-26px}
.cm.tr{top:0;right:0}.cm.tr::before{left:6px}.cm.tr::after{top:-26px}
.cm.bl{bottom:0;left:0}.cm.bl::before{left:-26px}.cm.bl::after{top:6px}
.cm.br{bottom:0;right:0}.cm.br::before{left:6px}.cm.br::after{top:6px}
.sqhint{margin:0;max-width:min(88vw,560px);text-align:center;font-size:13px;color:var(--mut)}
.sc .r2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;color:var(--mut)}
.sc .r2 .rl{display:flex;align-items:center;gap:10px;text-align:left}.sc .r2 i{font-style:normal;font-family:Oswald,Impact,sans-serif;font-size:16px}
.sc .r2 .nm b{display:block;font-family:Oswald,Impact,sans-serif;font-size:17px;color:#fff;letter-spacing:.02em}.sc .r2 .nm small{display:block;font-size:12px}
.sc .mvpbox .nm{display:block;margin:4px 0}.sc .mvpbox .nm b{display:block}.sc .mvpbox .nm small{display:block;font-family:system-ui,sans-serif;text-transform:none;font-size:18px;font-weight:600;letter-spacing:0}
.sc .foot{margin-top:16px;font-size:13px;color:var(--mut)}
/* banner "Vista giocatore" per l'admin */
.pv{display:flex;gap:10px;align-items:center;justify-content:space-between;border:2px dashed #fff;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--in)}
.pv button{flex:none}
/* admin: nuovi iscritti e staff */
:root{--staff:#4fc3f7;--fr:#a76bd8}
.card.nuovo{border-color:#fff}
.card.staff{background:color-mix(in srgb,var(--staff) 22%,#000);border-color:var(--staff)}
.tag.st{background:var(--staff);color:#000}
.tag.fr{background:var(--fr);color:#fff}
/* voto a slot: oro / argento / bronzo */
.slot{display:flex;gap:10px;align-items:center;margin:8px 0}
.slot .md{min-width:52px;text-align:center;font-size:28px;line-height:1}
.slot .md small{display:block;font:500 12px Oswald,Impact,sans-serif;color:var(--mut);margin-top:2px}
.slot select{flex:1;margin:0}
.slot.on select{border-color:#fff}
select:disabled{opacity:.45}
.coach{display:flex;gap:12px;align-items:center;background:#fff;color:color-mix(in srgb,var(--team) 60%,#000);border-radius:14px;padding:12px 14px;margin:10px 0}
.coach .st{font-size:34px;line-height:1;animation:pulse 1.6s ease-in-out 3}
.coach b{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:18px}
@keyframes pulse{50%{transform:scale(1.25) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){.coach .st{animation:none}}
.coach .st.still{animation:none}
.card.ok{border-color:#fff}
.li{font-size:14px;color:var(--hl);margin-top:4px}
.card.mc{display:block}.mcd{text-align:center;font-size:13px;color:var(--mut);text-transform:capitalize;margin-bottom:6px}.li.lv{text-align:center;color:#fff}.mt.mini{margin:0 0 8px;gap:10px}.mt.mini .mta,.mt.mini .mtb{font-size:clamp(15px,4.4vw,19px);color:#fff}
.mvs{font-family:Oswald,Impact,sans-serif;text-transform:lowercase;color:var(--mut);font-size:16px;padding:0 4px}.mt.mini .spill{font-size:17px;padding:2px 10px}
.mcm{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card.mc .li{text-align:center}
.ml{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px}.ml b{text-transform:uppercase;letter-spacing:.02em}.spill{background:#fff;color:var(--team);border-radius:99px;padding:0 9px;font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:15px;line-height:1.5;white-space:nowrap}
.mt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:14px 0 10px;font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.mta,.mtb{font-size:clamp(18px,5.4vw,26px);line-height:1.1;color:var(--hl)}.mta,.mtb{text-align:center}
.scg{margin:6px 0}.sci{display:flex;align-items:center;gap:8px}.sci input{width:60px;text-align:center;font-size:24px;font-family:Oswald,Impact,sans-serif;margin:0;padding:8px 4px}.sci b{font-size:22px}
.mts{background:#fff;color:var(--team);border-radius:14px;padding:4px 14px;font-size:clamp(26px,8vw,36px);font-weight:700;line-height:1.1;white-space:nowrap}.mts i{font-style:normal;margin:0 .15em;opacity:.6}
.ist{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}.ist:last-child{border-bottom:0}.ist .rk{flex:none}.ist b{display:block;margin-bottom:2px}
.cvs{font-weight:600}.cvs.yes{background:#fff;color:color-mix(in srgb,var(--team) 70%,#000);border-radius:99px;padding:1px 8px}.cvs.no{opacity:.75}.cvs.wait{font-style:italic;font-weight:400}
/* card convocazione */
.sc .cbox{background:#fff;color:color-mix(in srgb,var(--team) 60%,#000);border-radius:16px;padding:10px 14px;margin:6px 0 4px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;align-items:baseline}
.sc .cbox b{font-family:Oswald,Impact,sans-serif;font-size:21px;line-height:1.15;white-space:nowrap}.sc .cbox span{font-weight:600;font-size:15px;line-height:1.25}
.sc .mh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:6px}
.sc .lgw{justify-self:center;display:inline-flex}.sc .lgw .lg{height:118px;max-width:100%;object-fit:contain;object-position:center;margin:0}.sc .lgw.box{background:#fff;border-radius:16px;padding:6px 8px}.sc .lgw.box .lg{height:56px}
.sc .md{font-family:Oswald,Impact,sans-serif;font-size:18px;color:#fff;letter-spacing:.03em;margin-bottom:4px}
.sc .mvn{font-size:14px;font-weight:600;color:#fff;margin-bottom:10px}.sc .mvn span{display:block;font-weight:400;font-size:13px;color:var(--mut)}.sc .md:first-letter{text-transform:uppercase}
.sc .mv{min-width:46px;height:46px;padding:0 10px;border-radius:999px;white-space:nowrap;background:#fff;color:var(--team);display:flex;align-items:center;justify-content:center;font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em;box-shadow:0 0 0 4px color-mix(in srgb,#fff 25%,transparent)}
.sc .mo{justify-self:center;text-align:center;font-family:Oswald,Impact,sans-serif;text-transform:uppercase;font-size:clamp(16px,5vw,21px);line-height:1.1;word-break:break-word}
.sc .cl{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:5px 10px;text-align:left;margin-top:10px}.sc .cl div{min-width:0;display:flex;align-items:center;gap:8px;padding:3px 8px;border:1px solid var(--line);border-radius:10px}
.sc .cl .nm{min-width:0;line-height:1.1}.sc .cl .nm b{display:block;font-family:Oswald,Impact,sans-serif;font-size:16px;letter-spacing:.02em;overflow-wrap:anywhere}.sc .cl .nm small{display:block;font-size:12px;color:var(--mut)}
.sc .cl i{font-style:normal;color:var(--mut);font-family:Oswald,Impact,sans-serif;font-size:15px;min-width:18px;text-align:right}
.gkd{display:flex;flex-wrap:wrap;gap:4px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:Oswald,Impact,sans-serif;font-size:28px;line-height:1.1;color:#fff}
.stats span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.scr{justify-content:flex-start;gap:8px;margin:4px 0}.scr input{width:64px;text-align:center;font-size:20px;margin:0}.scr span{font-family:Oswald,Impact,sans-serif;text-transform:uppercase}
details.grp{background:var(--card);border:2px solid var(--line);border-radius:14px;margin:10px 0}
details.grp[open]{border-color:#fff}
/* iPhone: i campi orario non devono uscire dal riquadro */
input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left}
input[type=time]::-webkit-date-and-time-value{text-align:left}
.tmr{display:grid;grid-template-columns:136px 1fr;gap:8px;align-items:center}.tmr input{margin:4px 0}
details.grp.c-todo{border-color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,#fff 18%,transparent)}details.grp.c-todo summary .tag{background:#fff;color:var(--team)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.btns button{width:100%;margin:0}
details.grp.c-st,details.grp.c-st[open]{border-color:var(--staff);background:color-mix(in srgb,var(--staff) 16%,#000)}
details.grp.c-st summary b{color:var(--staff)}details.grp.c-st summary .tag{background:var(--staff);color:#000}
details.grp.c-ms,details.grp.c-ms[open]{border-color:#f5c518;background:color-mix(in srgb,#f5c518 12%,#000)}
details.grp.c-ms summary b{color:#f5c518}details.grp.c-ms summary .tag{background:#f5c518;color:#000}
details.grp.c-sp,details.grp.c-sp[open]{border-color:#9aa4ad;background:color-mix(in srgb,#9aa4ad 12%,#000)}
details.grp.c-sp summary b{color:#c9d0d6}details.grp.c-sp summary .tag{background:#9aa4ad;color:#000}
details.grp.c-fr,details.grp.c-fr[open]{border-color:var(--fr);background:color-mix(in srgb,var(--fr) 18%,#000)}
details.grp.c-fr summary b{color:var(--fr)}details.grp.c-fr summary .tag{background:var(--fr);color:#fff}
details.grp summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;cursor:pointer;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary b{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em}
details.grp summary::after{content:'▾';margin-left:4px;color:var(--mut)}details.grp[open] summary::after{content:'▴'}
details.grp summary .tag{margin-left:auto}
.gi{padding:0 12px 10px}
.ac{border-top:1px dashed var(--line);padding:8px 0}.ac:first-child{border-top:0}
.chk{display:flex;flex-wrap:wrap;gap:4px 16px}.chk label{display:flex;gap:6px;align-items:center;padding:4px 0}.chk input{width:auto;margin:0}
.card.live{border-color:#fff;background:color-mix(in srgb,var(--team) 55%,#000);box-shadow:0 0 0 3px color-mix(in srgb,var(--team) 50%,transparent),0 0 22px color-mix(in srgb,var(--team) 70%,transparent)}
.card.live .tag.o{background:#fff;color:var(--team);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.card.live .tag.o{animation:none}}
.card.test{border-style:dashed}
.tag.tt{background:#fff;color:#000}
.tag.ms{background:#f5c518;color:#000;font-weight:600}
.isms{border-left:4px solid #f5c518;padding-left:8px!important;border-radius:4px;background:color-mix(in srgb,#f5c518 12%,transparent)}
.card.more{background:transparent;margin-top:24px}
.card.more summary{cursor:pointer}
.card.ok p{margin:6px 0 0}
/* gruppi di pulsanti (convocazione, locandina): tutti i riquadri hanno la stessa misura */
.acts{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.ak{font:500 13px Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles button{margin:0;min-height:76px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;line-height:1.1}
.tiles button span{font-size:22px;line-height:1}
/* ricerca persone (pagina Admin) */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.chips button{width:auto;margin:0;padding:5px 10px;font-size:13px}
.sres{margin:6px 0;padding:4px 12px}
/* card convocazione: niente X, si chiude toccando; l'avviso sparisce prima dello screenshot */
#ov.tap{cursor:pointer}
.tapx{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;pointer-events:none;white-space:nowrap;animation:tapx 2.6s ease forwards}
@keyframes tapx{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.tapx{animation-duration:.01s;animation-delay:2.5s}}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const sb = supabase.createClient(SB_URL, SB_KEY);
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { me = null; prof = null; authView(); } });
const $ = id => document.getElementById(id), A = $('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
// Logo del sito su sfondo scuro: logo-bianco.png, se manca logo.png, se manca anche quello ⚽
const LOGO = `<img class="lg" src="logo-bianco.png" alt="Logo" onerror="if(this.dataset.f){this.replaceWith('⚽')}else{this.dataset.f=1;this.src='logo.png'}">`;
let lPh = null; // girone scelto nell'elenco partite
let me, prof, tab = 'p', cur = null, pick = null, regMode = false;

// ---------- VISTA GIOCATORE (solo per admin) ----------
// Se attiva, l'admin vede l'interfaccia come un compagno di squadra. Viene ricordata sul dispositivo.
let asPlayer = false;
try { asPlayer = localStorage.getItem('mvp_asPlayer') === '1'; } catch (e) {}
const isAdmin = () => !!(prof && prof.is_admin && !asPlayer);
function togglePreview() {
  asPlayer = !asPlayer;
  try { localStorage.setItem('mvp_asPlayer', asPlayer ? '1' : '0'); } catch (e) {}
  if (asPlayer && (tab === 'a' || tab === 'n')) tab = 'p';
  render(true);
}
async function act(fn, keep = true) { try { await fn(); } catch (e) { alert(e.message || e); } render(keep); }
const quiet = async (fn, el) => { try { await fn(); } catch (e) { if (el) el.checked = !el.checked; alert(e.message || e); } };
function go(t, id = null) { tab = t; cur = id; pick = null; render(); }

// ---------- INDIRIZZO DI OGNI SEZIONE ----------
// Il sito resta un unico file, ma l'indirizzo cambia con la sezione (es. …/#mvp, …/#gestione/<id>):
// così il tasto «Indietro» torna alla schermata precedente, ricaricando si resta dove si era
// e si può condividere il link di una sezione. I vecchi link …?match=<id> continuano a funzionare.
const ROUTES = { p: 'partite', c: 'mvp', g: 'marcatori', k: 'convocazioni', i: 'app', n: 'gestione', a: 'admin' };
const routeOf = () => cur ? 'partita/' + cur
  : ROUTES[tab] + (tab === 'n' && mg ? '/' + (mg === 'new' ? 'nuova' : mg) : tab === 'k' && ck ? '/' + ck : '');
function readRoute() {
  const h = decodeURIComponent(location.hash.slice(1));
  cur = null; mg = null; ck = null; pick = null; tab = 'p';
  if (!h || h.includes('=')) return; // indirizzo vuoto o dati del login (es. conferma email): si parte dalle partite
  const [a, b] = h.split('/');
  if (a === 'partita' && b) { cur = b; return; }
  const t = Object.keys(ROUTES).find(k => ROUTES[k] === a);
  if (!t) return;
  tab = t;
  if (t === 'n' && b) mg = b === 'nuova' ? 'new' : b;
  if (t === 'k' && b) ck = b;
}
let lastRoute = null;
function syncRoute() {
  const r = '#' + routeOf();
  if (location.hash !== r || location.search) {
    // il primo caricamento sostituisce l'indirizzo; i cambi di schermata aggiungono un passo per il tasto «Indietro»
    try { history[lastRoute === null ? 'replaceState' : 'pushState'](null, '', location.pathname + r); } catch (e) {}
  }
  lastRoute = r;
}
const onRoute = () => { if (location.hash === lastRoute) return; lastRoute = location.hash; readRoute(); render(); };
window.addEventListener('popstate', onRoute);
window.addEventListener('hashchange', onRoute);
const v = id => $(id).value.trim();

// ---------- ACCESSO ----------
function authView(err = '') {
  A.innerHTML = `<h1>${LOGO} MVP della Partita</h1><div class="card"><h3>${regMode ? 'Registrati' : 'Accedi'}</h3>
  ${regMode ? `<ol class="mut"><li>Scrivi nome e cognome, come ti chiamano in squadra.</li><li>Inserisci email e password (minimo 6 caratteri) e premi Registrati.</li><li>Aspetta che l’admin ti colleghi al tuo giocatore e ti abiliti al voto: fino ad allora puoi entrare, ma non votare.</li><li>Quando l’admin condivide nel gruppo il link di una partita, aprilo: se la votazione è aperta, puoi votare.</li><li>Consiglio: aggiungi il sito alla schermata Home del telefono.</li></ol>` : ''}
  ${err ? `<div class="err">${esc(err)}</div>` : ''}
  ${regMode ? '<div class="row"><input id="fn" placeholder="Nome"><input id="ln" placeholder="Cognome"></div>' : ''}
  <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min. 6 caratteri)">
  <button onclick="${regMode ? 'signUp()' : 'signIn()'}">${regMode ? 'Registrati' : 'Entra'}</button>
  <button class="g" onclick="regMode=!regMode;render()">${regMode ? 'Ho già un account' : 'Nuovo? Registrati'}</button></div>`;
}
async function signIn() {
  const r = await sb.auth.signInWithPassword({ email: v('em'), password: $('pw').value });
  if (r.error) return authView('Email o password non corretti.');
  render();
}
async function signUp() {
  const fn = v('fn'), ln = v('ln');
  if (!fn || !ln) return authView('Scrivi nome e cognome.');
  const r = await sb.auth.signUp({ email: v('em'), password: $('pw').value, options: { data: { display_name: fn + ' ' + ln } } });
  if (r.error) return authView(r.error.message);
  if (!r.data.session) { regMode = false; return authView('Registrazione fatta! Controlla la mail per confermare, poi accedi.'); }
  render();
}

// ---------- SCHERMATE ----------
async function render(keep) {
  const y = window.scrollY;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView();
  me = session.user;
  startPresence();
  if (!clockOk) { try { const t = await sb.rpc('server_now'); if (t.data) { clockOffset = new Date(t.data) - Date.now(); clockOk = true; } } catch (e) {} }
  // il profilo si aggiorna in parallelo alla pagina: se cambia qualcosa di importante, la pagina si ridisegna
  const profP = q(sb.from('profiles').select('*').eq('id', me.id).single());
  if (!prof || prof.id !== me.id) prof = await profP;
  const before = JSON.stringify([prof.is_admin, prof.is_coach, prof.can_vote]);
  const admin = isAdmin();
  // sezioni riservate: chi non ha i permessi torna alle partite
  if (((tab === 'a' || tab === 'n') && !admin) || (tab === 'k' && !prof.is_coach)) tab = 'p';
  let body;
  try { body = cur ? await matchView(cur) : tab === 'c' ? await rankView() : tab === 'g' ? await scorersView() : tab === 'k' && prof.is_coach ? await callupView() : tab === 'i' ? installView() : tab === 'a' && admin ? await adminView() : tab === 'n' && admin ? await manageView() : await matchesView(admin); }
  catch (e) { body = cur ? `<div class="err">Partita non trovata o non accessibile.</div><button onclick="go('p')">Torna alle partite</button>` : `<div class="err">${esc(e.message)}</div>`; }
  try { prof = await profP; } catch (e) {}
  if (JSON.stringify([prof.is_admin, prof.is_coach, prof.can_vote]) !== before) return render(keep);
  A.innerHTML = `<div class="top"><h1>${LOGO} MVP</h1><div style="text-align:right"><div class="mut">${esc(prof.display_name)}${admin ? ' · admin' : ''}${prof.is_coach ? ' · mister' : ''}</div>
  ${admin ? `<button class="g s on-pill" onclick="go('a')" title="Persone con il sito aperto ora">🟢 <span id="onl">${onlineIds.length}</span> online</button> ` : ''}${prof.is_admin ? `<button class="g s" onclick="togglePreview()">${asPlayer ? 'Vista admin' : 'Vista giocatore'}</button> ` : ''}${isApp ? '' : `<button class="g s" onclick="go('i')">📲 App</button> `}<button class="g s" onclick="logout()">Esci</button></div></div>
  ${prof.is_admin && asPlayer ? '<div class="pv"><span><b>Vista giocatore.</b> Vedi il sito come un compagno di squadra. I voti che dai qui sono veri.</span><button class="s" onclick="togglePreview()">Torna admin</button></div>' : ''}
  ${prof.can_vote ? '' : '<div class="card mut"><b>Account in attesa.</b> L’admin deve collegarti al tuo giocatore e abilitarti al voto. Intanto puoi vedere partite e podio.</div>'}${body}
  <nav><button class="${!cur && tab === 'p' ? 'on' : ''}" onclick="go('p')">Partite</button><button class="${tab === 'c' && !cur ? 'on' : ''}" onclick="go('c')">MVP</button><button class="${tab === 'g' && !cur ? 'on' : ''}" onclick="go('g')">Marcatori</button>${prof.is_coach && !admin ? `<button class="${tab === 'k' && !cur ? 'on' : ''}" onclick="ck=null;go('k')">Convocazioni</button>` : ''}
  ${admin ? `<button class="${tab === 'n' && !cur ? 'on' : ''}" onclick="mg=null;go('n')">Gestione</button><button class="${tab === 'a' && !cur ? 'on' : ''}" onclick="go('a')">Admin</button>` : ''}</nav>`;
  syncRoute();
  window.scrollTo(0, keep ? y : 0);
}

const OUT = { vittoria: 'Vittoria', pareggio: 'Pareggio', sconfitta: 'Sconfitta' };
const PH = { andata: 'Andata', ritorno: 'Ritorno' };
let clockOffset = 0, clockOk = false;
function cdText(d) {
  const ms = new Date(d) - (Date.now() + clockOffset);
  if (ms <= 0) return { text: 'Voto scaduto', expired: true };
  const t = Math.floor(ms / 60000), dd = Math.floor(t / 1440), hh = Math.floor((t % 1440) / 60), mm = t % 60;
  return { text: 'Scade tra ' + (dd ? dd + 'g ' : '') + (hh || dd ? hh + 'h ' : '') + mm + 'm', expired: false };
}
const ST = { draft: 'Bozza', open: 'Votazione aperta', closed: 'Chiusa' };
const stLabel = s => s === 'draft' && !isAdmin() ? 'Convocazioni' : ST[s];
// Chi può votare una partita (stessa regola usata nella pagina di voto)
const canVote = (m, cids, my, extraMe) => !!prof.can_vote && (m.voters === 'tutti' || !!prof.is_coach || !!(my && cids.includes(my.id)) || (m.voters === 'extra' && extraMe));
// Nomi degli admin da contattare (funzione admin_names su Supabase); se non disponibile, "un admin"
let adminList = null;
async function adminContact() {
  if (adminList === null) { try { const r = await sb.rpc('admin_names'); adminList = r.error ? [] : (r.data || []).map(x => x.display_name ?? x); } catch (e) { adminList = []; } }
  const n = adminList.map(esc);
  return n.length > 1 ? n.slice(0, -1).join(', ') + ' o ' + n[n.length - 1] : n[0] || 'un admin';
}
const need = (el, pct) => Math.max(1, Math.ceil(el * (pct ?? 50) / 100));
const quorumTxt = (vt, el, pct) => { const n = need(el, pct); return `Hanno votato ${vt} su ${el} · ${vt >= n ? '✓ minimo raggiunto' : `servono almeno ${n} voti per proclamare l’MVP`}`; };
// Mister ben visibili nelle liste giocatori (solo schermate admin)
const MS_TAG = ' <span class="tag ms">⭐ mister</span>';
const notEnabled = who => `Non sei abilitato al voto. Se pensi che sia un errore, scrivi a ${who}.`;

// Gruppi a scomparsa: restano aperti/chiusi anche dopo un aggiornamento della pagina
const openG = new Set();
const autoOpen = new Set(); // partite per cui la sezione «da fare» è già stata aperta in automatico
const grp = (k, title, badge, inner, hint = '', cls = '') => `<details class="grp ${cls}" ${openG.has(k) ? 'open' : ''} ontoggle="this.open ? openG.add('${k}') : openG.delete('${k}')"><summary><b>${title}</b><span class="tag">${badge}</span></summary><div class="gi">${hint ? `<p class="mut" style="margin-top:0">${hint}</p>` : ''}${inner || '<p class="mut">Nessuno.</p>'}</div></details>`;

// Menù "Gestione" (solo admin): creazione e gestione delle partite
let mg = null; // partita selezionata ('new' = nuova partita)
const newMatchForm = ms => `<div class="card"><input id="op" placeholder="Avversario"><select id="hm"><option value="1">🏠 In casa</option><option value="0">🚌 Fuori casa</option></select><div class="row"><input id="dt" type="date" value="${new Date().toISOString().slice(0, 10)}"></div><p class="mut" style="margin:6px 0 0">Risultato (facoltativo, puoi inserirlo dopo): l’esito si calcola da solo.</p><div class="row scr"><span>Noi</span><input id="gf" type="number" min="0" inputmode="numeric"><span>–</span><input id="ga" type="number" min="0" inputmode="numeric"><span>Loro</span></div><select id="ph">${Object.keys(PH).map(k => `<option value="${k}" ${(ms[0] && ms[0].phase || 'andata') === k ? 'selected' : ''}>Girone di ${PH[k].toLowerCase()}</option>`).join('')}</select><p class="mut">Puoi creare la partita in anticipo: resta in bozza finché non apri il voto: i compagni la vedono già, con l’elenco dei convocati, ma non possono votare.</p><label class="row" style="justify-content:flex-start;padding:6px 0"><input id="tst" type="checkbox" style="width:auto"> 🧪 Partita di test (la vedono solo gli admin)</label><button onclick="newMatch()">Crea partita</button></div>`;
async function manageView() {
  const ms = await q(sb.from('matches').select('*').order('played_on', { ascending: false }));
  if (mg && mg !== 'new' && !ms.some(m => m.id === mg)) mg = null;
  const back = '<button class="g s" onclick="mg=null;render()">← Tutte le partite</button>';
  if (mg === 'new') return `${back}<h2>Nuova partita</h2>${newMatchForm(ms)}`;
  if (mg) return back + await manageMatch(mg);
  ms.sort((a, b) => (b.status === 'open') - (a.status === 'open'));
  return `<h2>Gestione partite</h2><button onclick="mg='new';render()">➕ Nuova partita</button>
  <p class="mut">Tocca una partita per gestirla: convocati, esito, apertura e chiusura del voto.</p>
  ${ms.map(m => `<div class="card mc${m.status === 'open' ? ' live' : ''}${m.is_test ? ' test' : ''}" onclick="mg='${m.id}';render()" style="cursor:pointer"><div class="mcd">${m.is_test ? '<span class="tag tt">TEST</span> ' : ''}${dayShort(m.played_on)}${m.phase ? ' · ' + PH[m.phase] : ''} · ${ST[m.status]}</div>${miniTitle(m)}</div>`).join('') || '<p class="mut">Nessuna partita.</p>'}`;
}
async function manageMatch(id) {
  const admin = true;
  const [m, conv, players, extras] = await Promise.all([
    q(sb.from('matches').select('*').eq('id', id).single()), q(sb.from('match_players').select('player_id').eq('match_id', id)),
    q(sb.from('players').select('*').order('name')), q(sb.from('match_voters').select('profile_id').eq('match_id', id))]);
  const pfs0 = await q(sb.from('profiles').select('id,is_out,is_coach'));
  const outIds = pfs0.filter(x => x.is_out).map(x => x.id), coachIds = pfs0.filter(x => x.is_coach).map(x => x.id);
  const isMs = p => p.profile_id && coachIds.includes(p.profile_id);
  const isOutP = p => p.profile_id && outIds.includes(p.profile_id);
  callupMeta[id] = { opp: m.opponent, date: m.played_on, home: isHome(m), phase: m.phase };
  curMatch = m; curProg = m.status === 'open' ? await q(sb.from('voting_progress').select('*').eq('match_id', id).single()) : null;
  const cids = conv.map(c => c.player_id);
  let h = `${matchTitle(m)}<div class="mut" style="text-align:center;margin:-4px 0 4px"><span style="text-transform:capitalize">${dayTxt(m.played_on)}</span>${m.phase ? ' · ' + PH[m.phase] : ''}${m.is_test ? ' · 🧪 test' : ''}</div><div class="row" style="margin:6px 0"><span class="tag ${m.status === 'open' ? 'o' : ''}">${ST[m.status]}</span>${m.status !== 'draft' ? `<button class="g s" onclick="go('p','${id}')">Vai alla votazione</button>` : ''}</div>`;
  // Risultato e marcatori
  const goals = await q(sb.from('goals').select('*').eq('match_id', id).order('created_at'));
  const pName = pid => (players.find(p => p.id === pid) || {}).name;
  const conv1 = players.filter(p => cids.includes(p.id)), other = players.filter(p => !cids.includes(p.id));
  // marcatori e assist si scelgono solo tra i convocati
  const plOpts = () => conv1.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const full = hasScore(m) && goals.length >= m.goals_for;
  const inF = `<input id="gf" type="number" min="0" inputmode="numeric" value="${m.goals_for ?? ''}" aria-label="Gol ${TEAM}">`;
  const inA = `<input id="ga" type="number" min="0" inputmode="numeric" value="${m.goals_against ?? ''}" aria-label="Gol ${esc(m.opponent)}">`;
  const [sna, snb] = sideNames(m);
  const scoreBlock = `<p class="mut">Risultato:</p><div class="mt scg"><span class="mta">${sna}</span><span class="sci">${isHome(m) ? inF : inA}<b>–</b>${isHome(m) ? inA : inF}</span><span class="mtb">${snb}</span></div>
    <div class="row" style="margin-top:18px;justify-content:center;gap:10px"><button class="s" onclick="saveScore('${id}')">Salva risultato</button>${m.status === 'draft' && (hasScore(m) || m.outcome) ? `<button class="g s" onclick="clearScore('${id}')">Cancella risultato</button>` : ''}</div>
    <p class="mut">Esito: <b>${m.outcome ? OUT[m.outcome] : 'da decidere'}</b>${hasScore(m) ? ' (calcolato dal risultato)' : m.outcome ? ' — inserisci il risultato per confermarlo' : ''}</p>`;
  const goalsBlock = !hasScore(m) ? '<p class="mut">Inserisci prima il risultato, poi potrai indicare chi ha segnato.</p>'
    : m.goals_for === 0 ? '<p class="mut">Nessun gol segnato.</p>'
    : `${goals.map(g => `<div class="ac row"><span class="f">${goalLine(g, pName)}</span><button class="r s" onclick="delGoal('${g.id}')" aria-label="Elimina gol">✕</button></div>`).join('')}
      ${full ? `<p class="mut">✓ Tutti i ${m.goals_for} gol sono assegnati.</p>`
        : !conv1.length ? `<p class="mut">Gol da assegnare: <b>${m.goals_for - goals.length}</b> su ${m.goals_for}. Per indicare chi ha segnato, seleziona prima i convocati nella sezione «Convocati».</p>`
        : `<p class="mut">Gol da assegnare: <b>${m.goals_for - goals.length}</b> su ${m.goals_for}</p>
      <div class="card" style="margin:6px 0 0"><select id="gk" onchange="onKind()">${Object.entries(GK).map(([k, [ic, lb]]) => `<option value="${k}">${ic} ${lb}</option>`).join('')}</select>
      <select id="gs"><option value="">Chi ha segnato?</option>${plOpts()}</select>
      <select id="gas"><option value="">👟 Assist: nessuno</option>${plOpts()}</select>
      <button onclick="addGoal('${id}')">Aggiungi gol</button></div>`}`;
  const girBlock = `<p class="mut">Dove si gioca:</p><select onchange="setM('${id}',{is_home:this.value==='1'})"><option value="1" ${isHome(m) ? 'selected' : ''}>🏠 In casa</option><option value="0" ${isHome(m) ? '' : 'selected'}>🚌 Fuori casa</option></select><p class="mut">Girone:</p><select onchange="setM('${id}',{phase:this.value})">${Object.keys(PH).map(k => `<option value="${k}" ${(m.phase || 'andata') === k ? 'selected' : ''}>${PH[k]}</option>`).join('')}</select>`;
  const forceBlock = `${m.outcome === 'sconfitta' ? `<label class="row" style="justify-content:flex-start;padding:6px 0"><input type="checkbox" style="width:auto" ${m.force_vote ? 'checked' : ''} onchange="setM('${id}',{force_vote:this.checked})"> Consenti comunque il voto MVP (forzatura)</label>` : ''}`;
  const need = curProg ? Math.max(1, Math.ceil(curProg.eligible * (m.min_pct ?? 50) / 100)) : 1;
  const closeBtns = m.status !== 'open' ? '' : (!curProg || curProg.voted >= need)
    ? `<button class="s" onclick="if(confirm('Chiudere la votazione e proclamare l’MVP?'))closeVote('${id}',false)">Chiudi e proclama MVP</button>`
    : `<button class="s" onclick="if(confirm('Chiudere SENZA proclamare l’MVP?'))closeVote('${id}',false)">Chiudi senza MVP</button><button class="g s" onclick="if(confirm('Proclamare comunque l’MVP?'))closeVote('${id}',true)">Proclama comunque</button>`;
  const quorumBlock = `<p class="mut">Votanti minimi: <input type="number" min="0" max="100" step="5" value="${m.min_pct ?? 50}" style="width:84px;display:inline-block" onchange="setM('${id}',{min_pct:Math.min(100,Math.max(0,Number(this.value)||0))})"> % degli aventi diritto (0 = basta 1 voto)</p>${curProg ? `<p class="mut">${curProg.voted < need ? '⚠ ' : ''}Ora hanno votato ${curProg.voted} su ${curProg.eligible}: servono almeno ${need}.</p>` : ''}`;
  const durBlock = `<p class="mut">${m.status === 'open' ? 'Scadenza del voto (conta da adesso):' : 'Durata della votazione:'}</p><div class="row"><select id="dur" style="flex:1"><option value="">Nessuna scadenza</option>${[3, 6, 12, 24, 48, 72].map(n => `<option value="${n}">${n} ore</option>`).join('')}</select><button class="s" ${m.outcome ? '' : 'disabled style="opacity:.5"'} onclick="openVote('${id}')">${m.status === 'open' ? 'Aggiorna' : 'Apri voto'}</button></div>${m.outcome ? '' : '<p class="mut">Per aprire il voto imposta prima l’esito (qui sopra): serve a sapere se l’MVP si può votare.</p>'}`;
  let extraList = '';
  if (admin && m.voters === 'extra') {
    const pfs = await q(sb.from('profiles').select('*').eq('can_vote', true).order('display_name'));
    const xs = extras.map(e => e.profile_id);
    extraList = '<p class="mut">Extra (oltre ai convocati):</p>' + (pfs.filter(u => { const pl = players.find(p => p.profile_id === u.id); return !(pl && cids.includes(pl.id)); })
      .map(u => `<label class="row" style="justify-content:flex-start;padding:4px 0"><input type="checkbox" style="width:auto" ${xs.includes(u.id) ? 'checked' : ''} onchange="extraV('${id}','${u.id}',this)"> ${esc(u.display_name)}</label>`).join('') || '<span class="mut">Nessun altro account abilitato al voto.</span>');

let onlineCh = null, onlineIds = [], onlineNames = {};
function startPresence() {
  if (onlineCh || !me) return;
  try {
    onlineCh = sb.channel('online', { config: { presence: { key: me.id } } });
    onlineCh.on('presence', { event: 'sync' }, () => { onlineIds = Object.keys(onlineCh.presenceState()); updOnline(); })
      .subscribe(async st => { if (st === 'SUBSCRIBED') { try { await onlineCh.track({ t: Date.now() }); } catch (e) {} } });
  } catch (e) { onlineCh = null; }
}

  const tally = key => { const c = {}; gl.forEach(g => { const id = g[key]; if (!id) return; (c[id] ??= { name: nm(id), n: 0, k: {} }).n++; c[id].k[g.kind] = (c[id].k[g.kind] || 0) + 1; });

async function rankView() {
  // MVP valido: partita chiusa e quorum raggiunto (o MVP proclamato comunque dall'admin)
  const ms = (await q(sb.from('matches').select('*').order('played_on', { ascending: false }))).filter(m => m.status === 'closed' && m.quorum_met !== false && !m.is_test);
  if (!rkPh) rkPh = ms.some(m => m.phase === 'ritorno') ? 'ritorno' : 'andata';
  const sel = ms.filter(m => rkPh === 'tot' || (m.phase || 'andata') === rkPh);
  const rs = sel.length ? await q(sb.from('match_results').select('*').in('match_id', sel.map(m => m.id)).eq('position', 1)) : [];
  const cnt = {};
  rs.forEach(r => { const k = r.player_id ?? r.name; (cnt[k] = cnt[k] || { name: r.name, mvp_count: 0 }).mvp_count++; });
  let r = Object.values(cnt);
  r = r.map(x => ({ ...x, pos: 1 + r.filter(y => y.mvp_count > x.mvp_count).length })).sort((a, b) => a.pos - b.pos || a.name.localeCompare(b.name));
  const tabs = [['andata', 'Andata'], ['ritorno', 'Ritorno'], ['tot', 'Stagione']].map(([k, l]) => `<button class="s ${rkPh === k ? '' : 'g'}" onclick="rkPh='${k}';render(true)">${l}</button>`).join('');
  const title = rkPh === 'tot' ? 'Albo MVP di stagione' : `Albo MVP del girone di ${PH[rkPh].toLowerCase()}`;
  return `<h2>${title}</h2><div class="row" style="justify-content:flex-start;margin-bottom:6px">${tabs}</div><p class="mut">Tutti quelli che sono stati MVP almeno una volta. Ogni MVP di una partita vale +1; a pari merito stessa posizione. Partite contate: ${sel.length}.</p><div class="card">${r.map((x, i) => `${i && x.pos > 3 && r[i - 1].pos <= 3 ? '<div class="mut" style="border-top:1px dashed var(--line);margin:6px 0;padding-top:6px">Gli altri MVP</div>' : ''}<div class="row" style="padding:6px 0"><div class="rk">${x.pos}</div><div class="f"><b>${esc(x.name)}</b></div><b>${x.mvp_count} 🏆</b></div>`).join('') || '<span class="mut">L’albo si riempie dopo la prima partita chiusa di questo girone.</span>'}</div>`;
}

// Categorie degli account (una sola per persona):
//  collegato a un giocatore  -> In rosa (convocabile) | Fuori rosa (is_out: non convocabile)
//  non collegato             -> Staff (is_staff) | Spettatore (is_out) | Da sistemare (nessuna delle due)
// "Può votare" e "Mister" sono proprietà che si aggiungono alla categoria.
const OUT_LABEL = 'Fuori rosa';
const CAT = { rosa: 'In rosa', fuori: OUT_LABEL, staff: 'Staff', spett: 'Spettatore' };

// ---------- RICERCA PERSONE (pagina Admin) ----------
// Si scrivono nomi e/o parole chiave: tutte le condizioni devono valere insieme.
// «non» davanti a una parola la esclude (es. «mister non votanti», «admin non michele»).
let admQ = '', admPeople = [];
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
// Filtri: chiave -> [etichetta, prova sulla persona]
// Persona = { u: account (o null), p: giocatore (o null), cat: categoria, words: parole del nome }
const SF = {
  admin: ['Admin', x => !!(x.u && x.u.is_admin)],
  mister: ['Mister', x => !!(x.u && x.u.is_coach)],
  rosa: ['In rosa', x => x.cat === 'rosa' || x.cat === 'senza'],
  fuori: [OUT_LABEL, x => x.cat === 'fuori'],
  staff: ['Staff', x => x.cat === 'staff'],
  spett: ['Spettatori', x => x.cat === 'spett'],
  nuovo: ['Da sistemare', x => x.cat === 'nuovo'],
  vota: ['Può votare', x => !!(x.u && x.u.can_vote)],
  online: ['Online', x => !!(x.u && onlineIds.includes(x.u.id))],
  senza: ['Senza account', x => !x.u],
  account: ['Iscritti', x => !!x.u],
  giocatore: ['Giocatori', x => !!x.p],
  collegato: ['Collegati', x => !!(x.u && x.p)]
};
// Parole (singolari, plurali, sinonimi) -> filtro
const SW = { admin: 'admin', admins: 'admin', amministratore: 'admin', amministratori: 'admin',
  mister: 'mister', allenatore: 'mister', allenatori: 'mister', coach: 'mister',
  staff: 'staff', dirigente: 'staff', dirigenti: 'staff',
  spettatore: 'spett', spettatori: 'spett', spettatrice: 'spett', tifoso: 'spett', tifosi: 'spett',
  nuovo: 'nuovo', nuovi: 'nuovo', nuova: 'nuovo', nuove: 'nuovo',
  votante: 'vota', votanti: 'vota', abilitato: 'vota', abilitati: 'vota', abilitata: 'vota', abilitate: 'vota', vota: 'vota', votano: 'vota',
  online: 'online', connesso: 'online', connessi: 'online',
  giocatore: 'giocatore', giocatori: 'giocatore',
  collegato: 'collegato', collegati: 'collegato', iscritto: 'account', iscritti: 'account', iscritta: 'account', account: 'account',
  infortunato: 'fuori', infortunati: 'fuori', convocabile: 'rosa', convocabili: 'rosa' };
// Frasi di più parole, riconosciute prima delle singole parole
const SPH = [['fuori rosa', 'fuori'], ['in rosa', 'rosa'], ['da sistemare', 'nuovo'], ['senza account', 'senza'], ['puo votare', 'vota'], ['possono votare', 'vota'], ['scollegato', 'xcollegato'], ['scollegati', 'xcollegato']];
const STOP = new Set('tutti tutte tutto gli i il la le lo l e ed con che sono chi di del dei degli delle un una uno mostra cerca trova quali quanti solo anche come tipo per'.split(' '));
function parseQ(s) {
  let t = ' ' + norm(s) + ' ';
  SPH.forEach(([ph, k]) => { t = t.replace(new RegExp('\\b' + ph + '\\b', 'g'), ' k_' + k + ' '); });
  const f = [], names = []; let neg = false;
  for (const w of t.split(/\s+/).filter(Boolean)) {
    if (w === 'non') { neg = !neg; continue; }
    let k = w.startsWith('k_') ? w.slice(2) : SW[w];
    if (k === 'xcollegato') { k = 'collegato'; neg = !neg; }
    if (k) { const i = f.findIndex(x => x.k === k); if (i >= 0) f.splice(i, 1); f.push({ k, neg }); neg = false; continue; }
    if (STOP.has(w)) continue;
    names.push({ w, neg }); neg = false;
  }
  return { f, names };
}
// un pezzo di nome vale se è l'inizio di una parola del nome (o del nome del giocatore collegato)
const matchP = (x, P) => P.f.every(({ k, neg }) => SF[k][1](x) !== neg) && P.names.every(({ w, neg }) => x.words.some(y => y.startsWith(w)) !== neg);
const FWORD = { admin: 'admin', mister: 'mister', rosa: 'in rosa', fuori: 'fuori rosa', staff: 'staff', spett: 'spettatori', nuovo: 'da sistemare', vota: 'votanti', online: 'online', senza: 'senza account', account: 'iscritti', giocatore: 'giocatori', collegato: 'collegati' };
const serQ = P => [...P.names.map(n => (n.neg ? 'non ' : '') + n.w), ...P.f.map(x => (x.neg ? 'non ' : '') + FWORD[x.k])].join(' ');
// Pulsanti rapidi: [filtro, escluso?, etichetta]
const CHIPS = [['admin', false, 'Admin'], ['mister', false, '⭐ Mister'], ['rosa', false, 'In rosa'], ['fuori', false, OUT_LABEL], ['staff', false, 'Staff'], ['spett', false, 'Spettatori'],
  ['nuovo', false, 'Da sistemare'], ['vota', false, 'Può votare'], ['vota', true, 'Non può votare'], ['senza', false, 'Senza account'], ['online', false, '🟢 Online']];
const admChipsHtml = () => { const P = parseQ(admQ);
  return CHIPS.map(([k, n, l], i) => `<button class="s ${P.f.some(x => x.k === k && x.neg === n) ? '' : 'g'}" onclick="admChip(${i})">${l}</button>`).join('') + (admQ.trim() ? '<button class="s g" onclick="admSearch(\'\', true)">✕ Azzera</button>' : ''); };
function admResHtml() {
  const P = parseQ(admQ);
  if (!P.f.length && !P.names.length) return '';
  const r = admPeople.filter(x => matchP(x, P));
  const what = [...P.names.map(n => (n.neg ? 'non ' : '') + '«' + esc(n.w) + '»'), ...P.f.map(x => (x.neg ? 'non ' : '') + SF[x.k][0].toLowerCase())].join(' + ');
  return `<p class="mut" style="margin:8px 0 4px">Cerco: ${what} → <b>${r.length}</b> ${r.length === 1 ? 'risultato' : 'risultati'}</p>${r.map(x => `<div class="card sres">${x.html}</div>`).join('')}`;
}
function admSearch(val, setInput) {
  admQ = val;
  if (setInput && $('admQ')) $('admQ').value = val;
  if ($('admChips')) $('admChips').innerHTML = admChipsHtml();
  if ($('admRes')) $('admRes').innerHTML = admResHtml();
}
function admChip(i) {
  const [k, n] = CHIPS[i], P = parseQ(admQ), on = P.f.some(x => x.k === k && x.neg === n);
  P.f = P.f.filter(x => x.k !== k);
  if (!on) P.f.push({ k, neg: n });
  admSearch(serQ(P), true);
}

}
